<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Deep Dark Green Shield Container -->
  <rect width="512" height="512" rx="48" fill="#17352D"/>
  
  <!-- Metallic Gold Border -->
  <rect x="24" y="24" width="464" height="464" rx="32" fill="none" stroke="#A96F43" stroke-width="20"/>
  
  <!-- Monogram R & C -->
  <g transform="translate(90, 360)">
    <!-- R in Cream Ivory -->
    <text font-family="'Times New Roman', Georgia, serif" font-size="300" font-weight="bold" fill="#FAF8F2">R</text>
    <!-- C in Metallic Gold, positioned to overlap slightly -->
    <text x="165" y="-10" font-family="'Times New Roman', Georgia, serif" font-size="240" font-weight="bold" fill="#A96F43">C</text>
  </g>
  
  <!-- Bottom-Right Metallic Accent Corner Box -->
  <rect x="380" y="380" width="76" height="76" fill="#A96F43" stroke="#17352D" stroke-width="14"/>
</svg>